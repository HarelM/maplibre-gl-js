<!DOCTYPE html>
<html>
<head><style>body{margin:0;font-family:monospace}#map{width:1024px;height:768px}#stats{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.8);color:#0f0;padding:10px;font-size:13px;z-index:999;white-space:pre}</style></head>
<body>
<div id="map"></div>
<div id="stats">Loading...</div>
<script src="../../dist/maplibre-gl-dev.js"></script>
<script>
var map = new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[10.5,46.9],zoom:12,pitch:60});
window.map = map;
map.on('load',function(){map.addSource('terrain-dem',{type:'raster-dem',url:'https://tiles.mapterhorn.com/tilejson.json'});map.setTerrain({source:'terrain-dem',exaggeration:1.5});});
var bearing=0;
function animate(){bearing=(bearing+0.3)%360;map.setBearing(bearing);requestAnimationFrame(animate);}
map.on('idle',function(){setTimeout(animate,1000);});
var statsEl=document.getElementById('stats'),history={},SAMPLES=60;
setInterval(function(){
    var p=map.painter;if(!p||!p.gpuTimerResults)return;
    var r=p.gpuTimerResults,text='GPU Timer (ms):\n',labels=Object.keys(r).sort();
    for(var i=0;i<labels.length;i++){var l=labels[i],ms=r[l];
        if(!history[l])history[l]=[];history[l].push(ms);if(history[l].length>SAMPLES)history[l].shift();
        var sum=0;for(var j=0;j<history[l].length;j++)sum+=history[l][j];var avg=sum/history[l].length;
        text+='  '+l.padEnd(22)+'last:'+String(ms.toFixed(3)).padStart(8)+'  avg:'+String(avg.toFixed(3)).padStart(8)+'\n';
    }
    statsEl.textContent=text;window._gpuTimerResults=r;
},200);
</script>
</body></html>
